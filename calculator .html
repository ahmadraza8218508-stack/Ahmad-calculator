<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ahmad Calculator</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101827;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.calculator {
    width: 100%;
    max-width: 390px;
    background: #17243a;
    padding: 20px;
    border-radius: 25px;
    box-shadow: 0 10px 35px #0008;
}

h2 {
    color: white;
    text-align: center;
    margin: 5px 0 20px;
}

#display {
    width: 100%;
    height: 85px;
    background: #253650;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 32px;
    text-align: right;
    padding: 15px;
    margin-bottom: 20px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

button {
    height: 70px;
    border: none;
    border-radius: 14px;
    background: #168ce0;
    color: white;
    font-size: 24px;
    cursor: pointer;
}

button:active {
    opacity: 0.7;
    transform: scale(0.96);
}

.operator {
    background: #ed9b27;
}

.clear {
    background: #e34454;
}

.equal {
    background: #13a875;
}

.zero {
    grid-column: span 2;
}

.footer {
    color: #aabbd0;
    text-align: center;
    font-size: 12px;
    margin-top: 20px;
}
</style>
</head>

<body>

<div class="calculator">

<h2>AHMAD CALCULATOR</h2>

<input type="text" id="display"
placeholder="0" readonly>

<div class="buttons">

<button class="clear" onclick="clearDisplay()">AC</button>
<button class="operator" onclick="removeLast()">DEL</button>
<button class="operator" onclick="add('%')">%</button>
<button class="operator" onclick="add('/')">÷</button>

<button onclick="add('7')">7</button>
<button onclick="add('8')">8</button>
<button onclick="add('9')">9</button>
<button class="operator" onclick="add('*')">×</button>

<button onclick="add('4')">4</button>
<button onclick="add('5')">5</button>
<button onclick="add('6')">6</button>
<button class="operator" onclick="add('-')">−</button>

<button onclick="add('1')">1</button>
<button onclick="add('2')">2</button>
<button onclick="add('3')">3</button>
<button class="operator" onclick="add('+')">+</button>

<button class="zero" onclick="add('0')">0</button>
<button onclick="add('.')">.</button>
<button class="equal" onclick="calculate()">=</button>

</div>

<div class="footer">
Created by Ahmad
</div>

</div>

<script>

let display = document.getElementById("display");

function add(value) {
    if (display.value === "Error") {
        display.value = "";
    }
    display.value += value;
}

function clearDisplay() {
    display.value = "";
}

function removeLast() {
    display.value = display.value.slice(0, -1);
}

function calculate() {
    try {
        let expression = display.value;

        if (!expression || !/^[0-9+\-*/%.() ]+$/.test(expression)) {
            return;
        }

        let result = Function(
            '"use strict"; return (' + expression + ')'
        )();

        if (!Number.isFinite(result)) {
            display.value = "Error";
        } else {
            display.value = String(
                Number(result.toFixed(10))
            );
        }

    } catch {
        display.value = "Error";
    }
}

</script>

</body>
</html>
